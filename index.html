<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ellie Math</title>
<meta name="description" content="Number sense and math facts practice that rewards knowing, not guessing.">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ellie Math">
<meta name="theme-color" content="#3d6bd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
@font-face { font-family:"Fredoka"; font-weight:500; font-display:swap; src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family:"Fredoka"; font-weight:600; font-display:swap; src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family:"Fredoka"; font-weight:700; font-display:swap; src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
:root { --help-bg:color-mix(in srgb, var(--accent) 12%, var(--surface)); --bg:#fffaf3; --surface:#ffffff; --text:#2b2a33; --muted:#6b6878; --rule:#e6e1d8; --accent:#3d6bd6; --accent-ink:#ffffff;
  --a:#ef6a4c; --b:#3d8bd6; --c:#f0b429; --good:#23824a; --good-bg:#e3f5ea; --warn-bg:#fdf3dc; --help-bg:#eef3ff; --danger:#d4513a;
  --g0:#e9e4da; --g1:#f4b3a1; --g2:#f6d47f; --g3:#9bd8a9; --g4:#3f9e5e;
  --d1:#f0b429; --d10:#3d8bd6; --d100:#ef6a4c; --d1000:#7a5cd6; }
@media (prefers-color-scheme: dark) { :root { --bg:#17161c; --surface:#221f29; --text:#f3f1f7; --muted:#a7a3b3; --rule:#38343f; --accent:#7aa2ff; --accent-ink:#0e1530;
  --a:#ff8466; --b:#6aaeff; --c:#ffd166; --good:#6ad596; --good-bg:#173323; --warn-bg:#3a2f12; --help-bg:#1f2740; --danger:#ff7a66;
  --g0:#2e2a37; --g1:#8a3d2f; --g2:#806824; --g3:#2f7a48; --g4:#6ad596; } }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); overscroll-behavior:none; }
body { font:500 18px/1.45 "Fredoka", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; }
button { font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
html, body, .wrap, .practice, .overlay { touch-action:manipulation; }
.practice, .overlay, .break { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.parent, .parent input, .parent select { -webkit-user-select:auto; user-select:auto; }
.wrap { max-width:600px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size:34px; line-height:1.1; margin:8px 0 6px; font-weight:700; letter-spacing:-.01em; }
h2 { font-size:20px; margin:0 0 10px; }
.sub { color:var(--muted); margin:0 0 22px; }
.btn, .big-btn { display:block; width:100%; border:0; border-radius:20px; padding:18px; font-weight:700; text-align:center; }
.big-btn { background:var(--accent); color:var(--accent-ink); font-size:27px; padding:24px 18px; box-shadow:0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); margin-bottom:14px; transition:transform .08s, box-shadow .08s; }
.big-btn:active, .btn.secondary:active, .skill:active, .theme-card:active { transform:translateY(4px); box-shadow:0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.big-btn span { display:block; font-size:15px; font-weight:600; opacity:.85; margin-top:4px; }
.btn.secondary { background:var(--surface); border:2px solid var(--rule); font-size:20px; box-shadow:0 4px 0 var(--rule); transition:transform .08s, box-shadow .08s; }
.btn.small { display:inline-block; width:auto; padding:10px 16px; font-size:16px; border-radius:12px; margin:4px 4px 4px 0; }
.btn.danger { color:var(--danger); }
.card { background:var(--surface); border-radius:20px; padding:18px 20px; margin:18px 0; }
.card ul { margin:0; padding:0; list-style:none; } .card li { margin:8px 0; }
.back { background:none; border:0; color:var(--accent); font-weight:700; padding:0; margin-bottom:8px; font-size:17px; }
.grownup { position:relative; overflow:hidden; display:block; margin:18px auto 0; background:none; border:1px solid var(--rule); border-radius:999px; padding:10px 18px; font-size:14px; color:var(--muted); user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; z-index:0; }
.grownup .fillbar { position:absolute; inset:0 auto 0 0; width:0; background:var(--g0); z-index:-1; }
.grownup.holding .fillbar { width:100%; transition:width 1.5s linear; }

/* themed scene (collection) */
body { background:var(--bg); }
.home-top { display:flex; align-items:center; gap:12px; margin-top:6px; }
.home-top h1 { margin:0; }
.bubble { position:relative; background:var(--surface); border:2px solid var(--rule); border-radius:18px; padding:10px 14px; font-size:17px; margin:10px 0 16px; }
.bubble::before { content:""; position:absolute; top:-9px; left:26px; width:14px; height:14px; background:var(--surface); border-left:2px solid var(--rule); border-top:2px solid var(--rule); transform:rotate(45deg); }
.scene { position:relative; background:var(--scene); border-radius:22px; padding:16px 14px 34px; min-height:120px; margin:6px 0 18px; overflow:hidden; box-shadow:inset 0 -6px 0 rgba(0,0,0,.06); }
.scene.empty { display:grid; place-items:center; padding:22px 18px; }
.scene-msg { background:rgba(255,255,255,.88); color:#3a3540; border-radius:14px; padding:10px 14px; font-size:16px; text-align:center; max-width:420px; }
.scene { display:flex; flex-direction:column; }
.scene-items { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:flex-end; }
[data-theme=garden] .scene:not(.empty) { justify-content:flex-end; padding-bottom:40px; min-height:140px; }
[data-theme=ocean] .scene:not(.empty) { justify-content:center; padding-bottom:48px; min-height:150px; }
[data-theme=space] .scene:not(.empty) { justify-content:center; min-height:130px; }
[data-theme=space] .scene-items { gap:10px 14px; }
.scene-count, .scene-more { position:absolute; bottom:8px; font-size:14px; font-weight:700; background:rgba(255,255,255,.85); color:#3a3540; border-radius:999px; padding:2px 10px; }
.scene-count { right:12px; } .scene-more { left:12px; }
.slot-item { display:inline-block; animation:grow .55s cubic-bezier(.3,1.6,.6,1) both; transform-origin:50% 100%; }
.item { display:block; }
[data-theme=garden] .scene .item { width:30px; height:42px; }
[data-theme=ocean] .scene .item { width:38px; height:27px; animation:swim 3.5s ease-in-out infinite alternate; }
[data-theme=ocean] .scene .slot-item:nth-child(3n) .item { animation-duration:4.4s; } [data-theme=ocean] .scene .slot-item:nth-child(3n+1) .item { animation-delay:-1.3s; }
[data-theme=space] .scene .item { width:calc(30px * var(--s, 1)); height:calc(30px * var(--s, 1)); animation:twinkle 2.8s ease-in-out infinite; }
[data-theme=space] .scene .slot-item:nth-child(2n) .item { animation-delay:-1.4s; }
@keyframes grow { from { transform:scale(0) } to { transform:scale(1) } }
@keyframes swim { from { transform:translateX(-4px) } to { transform:translateX(4px) translateY(-3px) } }
@keyframes twinkle { 0%,100% { opacity:1; transform:scale(1) } 50% { opacity:.75; transform:scale(.88) } }
.worldbtn { background:none; border:0; color:var(--accent); font-weight:700; font-size:15px; padding:6px 0; }

/* her world (home + summary) */
.wrap.home { padding-top:calc(8px + env(safe-area-inset-top)); }
.world { position:relative; width:min(100vw, 980px); margin:0 0 14px calc(50% - min(50vw, 490px)); border-radius:0 0 30px 30px; overflow:hidden; box-shadow:0 8px 0 rgba(0,0,0,.06); }
.world.inset { width:100%; margin:6px 0 14px; border-radius:24px; }
.world-svg { display:block; width:100%; height:auto; }
.perch { position:absolute; left:3%; top:3%; right:3%; display:flex; align-items:flex-start; gap:8px; pointer-events:none; }
.perch .bubble { margin:6px 0 0; pointer-events:auto; max-width:min(46%, 420px); font-size:clamp(14px, 2.3vw, 18px); box-shadow:0 3px 0 rgba(0,0,0,.08); }
.perch .bubble::before { top:16px; left:-9px; transform:rotate(-45deg); }
.world .zhit { cursor:pointer; }
.world .zname { font-family:"Fredoka", system-ui, sans-serif; }
.world .hand { animation:tick 60s steps(60) infinite; transform-origin:0 0; }
@keyframes tick { to { transform:rotate(360deg) } }
[data-theme=classroom] .zchip { background:#f3f7fa; }
.world .zsign text { font-family:"Fredoka", system-ui, sans-serif; }
.wi.fresh { animation:arrive .8s cubic-bezier(.3,1.7,.6,1) both; transform-box:fill-box; transform-origin:50% 100%; }
.wi.fresh svg { filter:drop-shadow(0 0 6px #fff); }
@keyframes arrive { 0% { transform:scale(0) translateY(-30px); opacity:0 } 60% { opacity:1 } 100% { transform:scale(1) translateY(0); opacity:1 } }
.world .twk { animation:twinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
.world .swim { animation:swim 3.2s ease-in-out infinite alternate; }
.world .cloud { animation:drift 38s ease-in-out infinite alternate; } .world .cloud.c2 { animation-duration:52s; animation-direction:alternate-reverse; }
@keyframes drift { from { transform:translateX(-40px) } to { transform:translateX(60px) } }
.world .sun { animation:pulse 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes pulse { 50% { transform:scale(1.05) } }
.world .weed { animation:sway 5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 100%; } .world .weed.w2 { animation-delay:-2.5s; }
@keyframes sway { from { transform:rotate(-5deg) } to { transform:rotate(5deg) } }
.world .bub { animation:rise 7s linear infinite; } .world .b1 { animation-delay:-2s } .world .b2 { animation-delay:-4s } .world .b3 { animation-delay:-5.5s }
@keyframes rise { from { transform:translateY(0); opacity:.8 } to { transform:translateY(-640px); opacity:0 } }
.world .deco { animation:bob 3.4s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
.world .deco.fresh { animation:arrive 1s cubic-bezier(.3,1.7,.6,1) both, bob 3.4s 1s ease-in-out infinite alternate; }
@keyframes bob { from { transform:translateY(0) } to { transform:translateY(-6px) } }
.surprise { background:var(--surface); border:2px solid var(--rule); border-radius:18px; padding:10px 14px; margin:0 0 14px; font-weight:600; font-size:16px; }
.surprise .bar { margin-top:8px; height:12px; } .surprise .bar i { background:var(--accent); border-radius:6px; }
.tap-hint { color:var(--muted); font-size:14px; text-align:center; margin:-6px 0 12px; }
/* zone close-up */
.sheet.zone { max-width:560px; text-align:left; max-height:86vh; overflow:auto; }
.zhead { font-size:24px; font-weight:700; } .zsub { color:var(--muted); margin:2px 0 12px; }
.zgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:8px; }
.zchip { display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--tint); border-radius:14px; padding:8px 4px 6px; font-weight:600; font-size:14px; }
.zchip.s0 { opacity:.55; } .zchip.s3 { box-shadow:inset 0 0 0 2px #ffd23f; }
[data-theme=space] .zchip { background:#1d1c45; color:#fff; } [data-theme=ocean] .zchip { background:#d9f2fd; }
.zlegend { color:var(--muted); font-size:13px; margin:12px 0 0; }
.milestone-big { font-size:96px; line-height:1; animation:arrive 1s cubic-bezier(.3,1.7,.6,1) both; }

/* avatar builder */
.avstage { display:flex; align-items:center; gap:18px; background:var(--tint); border-radius:24px; padding:14px 18px; margin:6px 0 14px; }
.avpreview { background:rgba(255,255,255,.85); border-radius:20px; padding:6px 10px 0; }
.avname { flex:1; display:flex; flex-direction:column; gap:6px; font-weight:700; background:rgba(255,255,255,.9); border-radius:16px; padding:10px 12px; color:#3a3540; }
.avname input { font:600 22px "Fredoka", system-ui, sans-serif; padding:8px 10px; border-radius:12px; border:2px solid var(--rule); max-width:100%; background:#fff; color:#2b2a33; }
.avrow { margin:10px 0; } .avlab { font-weight:700; margin-bottom:6px; }
.avopts { display:flex; flex-wrap:wrap; gap:8px; }
.avsw { width:44px; height:44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px var(--rule); }
.avsw.on { box-shadow:0 0 0 3px var(--accent); transform:scale(1.08); }
.avchip { display:flex; flex-direction:column; align-items:center; background:var(--surface); border:2px solid var(--rule); border-radius:14px; padding:4px 6px 4px; font-size:13px; font-weight:600; text-transform:capitalize; min-width:62px; }
.avchip.on { border-color:var(--accent); background:var(--tint); }
.perch .avatar { flex:none; margin-top:-4px; }
.avatar .wavehand { animation:wave 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%; }
@keyframes wave { 0%, 60%, 100% { transform:rotate(0) } 70% { transform:rotate(-18deg) } 85% { transform:rotate(14deg) } }
/* Teach Dot */
.teach-scene { display:flex; align-items:flex-end; justify-content:center; gap:16px; background:var(--tint); border-radius:22px; padding:12px 16px 6px; width:100%; max-width:540px; }
[data-theme=classroom] .teach-scene { background:#fdfefe; border:8px solid #b7c0ca; }
[data-theme=space] .teach-scene { background:#1d1c45; } [data-theme=space] .dot-says { color:#2b2a33; }
.teach-dot { display:flex; align-items:flex-end; gap:8px; }
.dot-says { position:relative; background:var(--surface); color:var(--text); border:2px solid var(--rule); border-radius:16px; padding:10px 14px; font-size:20px; text-align:left; max-width:280px; margin-bottom:30px; }
.teach-eq { margin-top:8px; }
.notebook { display:block; width:100%; text-align:left; background:var(--surface); border:2px dashed var(--rule); border-radius:16px; padding:12px 14px; margin:12px 0; font-size:17px; }
.nbgrid { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0; } .nbgrid span { background:var(--tint); border-radius:10px; padding:4px 10px; font-weight:600; }

.cardline { background:var(--surface); border:2px dashed var(--accent); border-radius:16px; padding:10px 14px; margin:0 0 12px; font-weight:600; }
.cardline.seen { border-style:solid; border-color:var(--rule); color:var(--muted); }
.gwrap { margin:18px 0; } .gwrap > summary { cursor:pointer; font-weight:700; color:var(--muted); padding:10px 0; list-style:none; } .gwrap > summary::-webkit-details-marker { display:none; }
.todaycard .gcard { margin:8px 0 0; }
.idk.showme { border-style:solid; border-color:var(--accent); color:var(--accent); }
.idk.showme.hidden { display:none; }
.wi.s4 svg, svg.thirsty { filter:saturate(.25) brightness(1.08); opacity:.72; }
[data-theme=garden] .wi.s4 svg { transform:rotate(-8deg); transform-origin:50% 100%; }
.parent .warn-banner { background:var(--warn-bg); border-left:5px solid var(--danger); padding:10px 14px; border-radius:10px; color:var(--text); }
@media (prefers-color-scheme: dark) { [data-theme=classroom] .zchip, [data-theme=ocean] .zchip { background:var(--tint); color:var(--text); } }
/* iPad: use the screen */
.three li { margin:0 0 10px; } .pcard { border:2px solid var(--rule); border-radius:16px; padding:14px; text-align:center; } .pq { font-size:48px; font-weight:700; }

/* theme picker */
.themes { display:grid; gap:12px; }
.theme-card { display:grid; grid-template-columns:120px 1fr; grid-template-rows:auto auto; column-gap:14px; align-items:center; text-align:left; background:var(--surface); border:3px solid var(--rule); border-radius:22px; padding:10px; box-shadow:0 4px 0 var(--rule); transition:transform .08s, box-shadow .08s; }
.theme-card.on { border-color:var(--accent); }
.tc-scene { grid-row:1 / span 2; height:84px; border-radius:16px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:2px; padding:6px; }
.tc-scene .slot-item { animation:none; } .tc-scene .item { width:30px; height:34px; }
[data-tc=ocean] .tc-scene { align-items:center; padding-bottom:22px; } [data-tc=space] .tc-scene { align-items:center; }
.tc-name { font-size:24px; font-weight:700; align-self:end; } .tc-pitch { color:var(--muted); font-size:16px; align-self:start; }

/* Dot, the companion */
.dotpal { flex:none; overflow:visible; }
.dotpal .body { fill:var(--a); } .dotpal .shine { fill:rgba(255,255,255,.35); }
.dotpal .face, .dotpal .arm { stroke:#2b1d1a; fill:#2b1d1a; } .dotpal .arm { stroke:var(--a); fill:none; }
.dotpal .face path:not(.fillmouth) { fill:none; }
.dotpal .glasses { fill:none; stroke:#2b1d1a; stroke-width:3.2; stroke-linecap:round; }
.dotpal .fillmouth { fill:#7a2a22; stroke:none; } .dotpal .cheek { fill:rgba(255,255,255,.4); } .dotpal .spark { fill:var(--c); }
.dotpal .blink { animation:blink 4.5s infinite; transform-origin:50% 44%; transform-box:view-box; }
.dotpal.mood-cheer, .dotpal.mood-wow { animation:bounce .7s ease-in-out infinite alternate; }
.dotpal.mood-happy, .dotpal.mood-proud { animation:hop .45s ease-out; }
.dotpal.mood-curious { animation:tilt .5s ease-out both; }
.dotpal .spark { animation:twinkle 1s ease-in-out infinite; transform-box:fill-box; transform-origin:center; } .dotpal .s2 { animation-delay:-.5s; }
@keyframes blink { 0%, 94%, 100% { transform:scaleY(1) } 96% { transform:scaleY(.1) } }
@keyframes hop { 0% { transform:translateY(0) } 40% { transform:translateY(-7px) } 100% { transform:translateY(0) } }
@keyframes tilt { to { transform:rotate(-10deg) } }
.topbar .dotpal { margin-left:2px; }

/* skills */
.skill { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface); border:2px solid var(--rule); border-radius:18px; padding:14px 16px; margin-bottom:10px; }
.skill .ico { font-size:30px; width:40px; text-align:center; }
.skill .name { font-weight:700; } .skill .desc { font-size:14px; color:var(--muted); }
.skill .meta { flex:1; min-width:0; }
.skill[disabled] { opacity:.5; cursor:default; }
.skill .done { font-size:22px; }
.bar { display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--g0); margin-top:8px; }
.bar i { display:block; height:100%; } .bar .f { background:var(--g4); } .bar .l { background:var(--g2); }

/* practice */
.practice { display:flex; flex-direction:column; min-height:100vh; min-height:100dvh; padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); }
.topbar { display:flex; align-items:center; gap:10px; }
.icon-btn { background:var(--surface); border:2px solid var(--rule); border-radius:12px; width:44px; height:44px; font-size:18px; flex:none; }
.progress { flex:1; height:14px; background:var(--g0); border-radius:8px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--accent); border-radius:8px; transition:width .3s; }
.blockname { font-size:13px; color:var(--muted); white-space:nowrap; font-weight:600; }
.stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:10px 0; min-height:0; }
.tag { font-size:14px; font-weight:700; background:var(--warn-bg); padding:4px 12px; border-radius:999px; }
.ask { font-size:23px; font-weight:700; max-width:520px; }
.ask small { display:block; font-size:15px; font-weight:600; color:var(--muted); margin-top:4px; }
.eq { font-size:clamp(42px, 11.5vw, 64px); font-weight:700; letter-spacing:.02em; white-space:nowrap; }
.eq.small { font-size:clamp(28px, 8vw, 40px); } .eq.seq { font-size:clamp(24px, 6.5vw, 36px); } .eq.cmp { font-size:clamp(30px, 9vw, 46px); }
.eq .or { font-size:.5em; color:var(--muted); font-weight:600; padding:0 8px; }
.slot { display:inline-block; min-width:1.5em; padding:0 .12em; border-bottom:5px solid var(--accent); color:var(--accent); text-align:center; vertical-align:baseline; line-height:1; }
.slot.wide { border:3px solid var(--accent); border-radius:16px; padding:6px 16px; min-width:3.2em; background:var(--surface); }

.visual:empty { display:none; }
.visual { width:100%; display:flex; justify-content:center; align-items:center; gap:28px; flex-wrap:wrap; }
.cover { display:grid; place-items:center; min-height:100px; font-size:20px; color:var(--muted); }
.ready { background:var(--accent); color:var(--accent-ink); border:0; border-radius:18px; padding:22px 30px; font-size:24px; font-weight:800; box-shadow:0 5px 0 rgba(0,0,0,.15); }
.ready[disabled] { opacity:.5; }
.lookagain { background:none; border:2px dashed var(--rule); border-radius:12px; padding:8px 14px; font-weight:700; color:var(--muted); }
.msg { min-height:1em; max-width:520px; border-radius:16px; font-size:19px; }
.msg:empty { display:none; }
.msg.good { background:var(--good-bg); color:var(--good); font-weight:800; font-size:24px; padding:10px 18px; animation:pop .3s ease-out; }
.msg.help { background:var(--help-bg); padding:12px 16px; text-align:left; }
.msg.soft { background:var(--warn-bg); padding:10px 16px; }
@keyframes pop { from { transform:scale(.85); opacity:0 } to { transform:scale(1); opacity:1 } }
